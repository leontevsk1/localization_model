[network]
nodes = 8
space_min = 0.0
space_max = 100.0
gps_err = 3.0       # Нормальный старт
dist_err = 12.0     # Ужасные показания дальномеров

[hyperparams]
alpha = 0.01        # Маленький шаг, чтобы градиент не "разорвало" от шума
lambda = 0.8        # Сильно держимся за стартовые координаты
eps = 0.001         # Грубый порог остановки (точнее не соберется)
max_iter = 3000
ekf_iter = 25       # EKF нужно больше тактов для сглаживания
q = 0.001
r = 144.0           # Квадрат ошибки (12^2) — фильтр не доверяет измерениям

[topology]
k = 7
